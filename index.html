<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102239"><title>Blox Islands — Adventure</title>
<style>
:root{color-scheme:dark;--panel:rgba(12,21,36,.94);--line:#ffffff2b;--gold:#ffce55;--mint:#7af0ac;--ink:#f4f8ff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#1476ad;color:var(--ink);font:14px system-ui,Arial,sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}button{font:inherit;color:inherit;cursor:pointer}.hud{position:fixed;inset:0;pointer-events:none}.panel,.toolbar,.actions,.modal,.mobile{pointer-events:auto}.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 25px #0005;backdrop-filter:blur(8px)}.stats{left:10px;bottom:10px;width:255px}.brand{font-weight:1000;font-size:16px;margin-bottom:6px}.barrow{display:grid;grid-template-columns:45px 1fr;gap:6px;align-items:center;margin:4px 0;font-size:11px;font-weight:800}.bar{height:10px;background:#ffffff20;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;transition:width .15s}.hp{background:linear-gradient(90deg,#ff4f67,#ff9180)}.en{background:linear-gradient(90deg,#398aff,#69d8ff)}.xp{background:linear-gradient(90deg,#ffbe45,#ffe38c)}#statsLine{font-size:11px;margin:6px 0;font-weight:700}.quest{top:10px;left:10px;width:225px}.quest small{color:#99aec5}.quest strong{display:block;color:var(--mint);margin:4px 0}.quest p{margin:0;font-size:12px}.moves{right:10px;bottom:10px;width:220px}.moves h3{margin:0 0 6px;font-size:14px}.move{display:flex;justify-content:space-between;border-top:1px solid #ffffff15;padding:5px 0;font-size:12px}.toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:5px}.slot,.action,.cornerButtons button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-weight:800}.slot{min-width:76px;height:50px;text-align:left}.slot.active{border:2px solid var(--gold)}.slot:disabled{opacity:.4}.slot kbd{float:right}.slot strong{display:block;font-size:11px;margin-top:3px}.actions{position:absolute;left:10px;bottom:130px;display:grid;gap:5px}.cornerButtons{display:flex;gap:5px}.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:var(--panel);padding:9px 14px;border:1px solid var(--line);border-radius:9px;opacity:0;transition:opacity .2s;font-weight:800;text-align:center}.region{position:absolute;top:32%;left:50%;transform:translateX(-50%);font-size:clamp(28px,5vw,56px);font-weight:1000;text-shadow:0 4px 16px #000;opacity:0;transition:opacity .5s;white-space:nowrap}.help{position:absolute;right:10px;top:10px;background:var(--panel);padding:6px 8px;border-radius:7px;font-size:10px}.modal{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(660px,calc(100% - 20px));max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 70px #0009}.modal h2{margin:0 0 10px}.close{float:right;background:#ffffff18;border:0;border-radius:7px;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.fruitGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#ffffff0b;border:1px solid var(--line);border-radius:9px;padding:9px}.card button,.modal button.buy{background:var(--gold);color:#322716;border:0;border-radius:6px;padding:5px 9px;font-weight:900;margin-top:6px}.statrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}.mobile{display:none;position:absolute;right:12px;bottom:125px;gap:5px;flex-wrap:wrap;width:125px}.mobile button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#102239cc;touch-action:none}.safe{color:#7af0ac;font-weight:800}@media(max-width:700px){.stats{width:190px;left:6px;bottom:6px;padding:7px}.quest{left:6px;top:6px;width:190px}.moves{right:6px;bottom:72px;width:165px;padding:7px}.toolbar{bottom:6px;gap:2px}.slot{min-width:53px;height:44px;padding:4px}.slot strong{font-size:9px}.actions{left:6px;bottom:145px}.help{display:none}.mobile{display:flex}.fruitGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><canvas id="game" aria-label="Blox Islands game world"></canvas><div class="hud">
<section class="panel stats"><div class="brand">🏝️ BLOX ISLANDS</div><div class="barrow"><b>HP</b><div class="bar"><div id="hpFill" class="fill hp"></div></div></div><div class="barrow"><b>ENERGY</b><div class="bar"><div id="energyFill" class="fill en"></div></div></div><div class="barrow"><b>XP</b><div class="bar"><div id="xpFill" class="fill xp"></div></div></div><div id="statsLine"></div><div class="cornerButtons"><button id="statsBtn">📊 Stats</button><button id="bagBtn">🎒 Backpack</button></div></section>
<section class="panel quest"><small id="seaLabel"></small><strong id="questName">Quest</strong><p id="questText"></p></section><section class="panel moves"><h3 id="moveTitle">Combat</h3><div id="moveList"></div></section><div id="regionName" class="region"></div><div id="toast" class="toast"></div>
<div class="toolbar"><button class="slot active" data-slot="1"><kbd>1</kbd><strong>Combat</strong></button><button class="slot" data-slot="2" disabled><kbd>2</kbd><strong>Sword</strong></button><button class="slot" data-slot="3" disabled><kbd>3</kbd><strong>Fruit</strong></button><button class="slot" data-slot="4" disabled><kbd>4</kbd><strong>Style</strong></button></div>
<div class="actions"><button class="action" id="interactBtn">ⓔ Interact</button><button class="action" id="mapBtn">🗺️ Map</button></div><div class="help">WASD/arrows move · Click/Z attack · X skill · E interact · B boat · H haki · M menu</div><div class="mobile" id="mobile"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button><button data-key="z">⚔</button><button data-key="x">✦</button><button data-key="e">E</button><button data-key="b">⛵</button></div>
<section class="modal" id="modal"><button class="close" id="closeModal">Close ✕</button><h2 id="modalTitle">Menu</h2><div id="modalBody"></div></section></div><script src="./game.js?v=5"></script></body></html>
