<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102239"><title>Blox Islands — 3D Adventure</title><style>
:root{color-scheme:dark;--panel:rgba(12,21,36,.94);--line:#ffffff2b;--gold:#ffce55;--mint:#7af0ac;--ink:#f4f8ff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#1476ad;color:var(--ink);font:14px system-ui,Arial,sans-serif;user-select:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}button{font:inherit;color:inherit;cursor:pointer}.hud{position:fixed;inset:0;pointer-events:none}.panel,.actions{pointer-events:auto}.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 25px #0005}.stats{left:10px;bottom:10px;width:240px}.brand{font-weight:1000;font-size:16px;margin-bottom:6px}.barrow{display:grid;grid-template-columns:45px 1fr;gap:6px;align-items:center;margin:4px 0;font-size:11px;font-weight:800}.bar{height:10px;background:#ffffff20;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;transition:width .15s}.hp{background:linear-gradient(90deg,#ff4f67,#ff9180)}.en{background:linear-gradient(90deg,#398aff,#69d8ff)}.xp{background:linear-gradient(90deg,#ffbe45,#ffe38c)}#statsLine{font-size:11px;margin:6px 0;font-weight:700}.quest{top:10px;left:10px;width:210px}.quest small{color:#99aec5}.quest strong{display:block;color:var(--mint);margin:4px 0}.quest p{margin:0;font-size:12px}.actions{position:absolute;left:10px;bottom:125px;display:grid;gap:5px}.actions button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px;font-weight:800}.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:var(--panel);padding:9px 14px;border:1px solid var(--line);border-radius:9px;opacity:0;transition:opacity .2s;font-weight:800}.help{position:absolute;right:10px;top:10px;background:var(--panel);padding:7px 9px;border-radius:7px;font-size:11px}@media(max-width:700px){.stats{width:190px;left:6px;bottom:6px;padding:7px}.quest{left:6px;top:6px;width:190px}.help{display:none}.actions{left:6px;bottom:115px}}
</style></head><body><canvas id="game" aria-label="3D Blox Islands game world"></canvas><div class="hud"><section class="panel stats"><div class="brand">🏝️ BLOX ISLANDS</div><div class="barrow"><b>HP</b><div class="bar"><div id="hpFill" class="fill hp"></div></div></div><div class="barrow"><b>ENERGY</b><div class="bar"><div id="energyFill" class="fill en"></div></div></div><div class="barrow"><b>XP</b><div class="bar"><div id="xpFill" class="fill xp"></div></div></div><div id="statsLine"></div></section><section class="panel quest"><small id="seaLabel"></small><strong id="questName">Starter Island</strong><p id="questText">WASD move · Space jump · drag to look</p></section><div class="actions"><button id="interactBtn" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'e'}))">ⓔ Interact</button><button id="mapBtn" onclick="location.reload()">🗺️ Reset view</button></div><div class="help">WASD move · Space jump · Drag/touch to orbit · Wheel zoom · Z or click attack</div><div id="toast" class="toast"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script><script src="./game.js?v=10"></script></body></html>
