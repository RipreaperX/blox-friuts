<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102239"><title>Blox Islands</title>
<style>
:root{--panel:rgba(12,21,36,.95);--line:#ffffff2b;--gold:#ffce55;--mint:#7af0ac;--ink:#f4f8ff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#1476ad;color:var(--ink);font:14px system-ui,Arial,sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}button{font:inherit;color:inherit;cursor:pointer}.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:0 8px 25px #0005;backdrop-filter:blur(8px);pointer-events:auto}.stats{left:12px;top:12px;width:255px}.brand{font-weight:1000;font-size:17px;margin-bottom:8px}.barrow{display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center;margin:5px 0;font-size:12px;font-weight:800}.bar{height:11px;background:#ffffff20;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;transition:width .15s}.hp{background:linear-gradient(90deg,#ff4f67,#ff9180)}.en{background:linear-gradient(90deg,#398aff,#69d8ff)}.xp{background:linear-gradient(90deg,#ffbe45,#ffe38c)}#statsLine{font-size:12px;margin:7px 0;font-weight:700}.cornerButtons{display:flex;gap:6px}.cornerButtons button,.action{background:#ffffff12;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-weight:800}.quest{top:12px;left:280px;width:235px}.quest small{color:#99aec5}.quest strong{display:block;color:var(--mint);margin:4px 0}.quest p{margin:0;font-size:12px;line-height:1.35}.moves{right:12px;bottom:90px;width:245px}.moves h3{margin:0 0 7px;font-size:15px}.move{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff15;padding:6px 0;font-size:12px}.move button{background:#ffce5520;border:1px solid #ffce5570;border-radius:6px;padding:3px 8px;font-weight:900}.toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.slot{min-width:92px;height:58px;background:var(--panel);border:2px solid var(--line);border-radius:11px;padding:6px 9px;text-align:left;box-shadow:0 5px 16px #0005}.slot.active{border-color:var(--gold);box-shadow:0 0 15px #ffd04b65}.slot:disabled{opacity:.42;cursor:not-allowed}.slot kbd{float:right;background:#ffffff20;padding:1px 5px;border-radius:4px}.slot strong{display:block;font-size:12px;margin-top:5px}.actions{position:absolute;left:13px;top:155px;display:flex;gap:6px;pointer-events:auto}.action:hover,.slot:not(:disabled):hover{border-color:var(--gold)}#toast{position:absolute;top:118px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 15px;border-radius:9px;opacity:0;transition:opacity .2s;font-weight:800;text-align:center;pointer-events:none}.modal{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 24px));max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;pointer-events:auto;box-shadow:0 20px 70px #0008}.modal h2{margin:0 0 10px}.modal .close{float:right;background:#ffffff18;border:0;border-radius:7px;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fruitGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#ffffff0b;border:1px solid var(--line);border-radius:10px;padding:10px}.card button,.statrow button{background:var(--gold);color:#322716;border:0;border-radius:7px;padding:6px 10px;font-weight:900;margin-top:7px}.statrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.region{position:absolute;top:32%;left:50%;transform:translateX(-50%);font-size:clamp(28px,5vw,56px);font-weight:1000;text-shadow:0 4px 16px #000;opacity:0;transition:opacity .5s;pointer-events:none}.help{position:absolute;right:12px;bottom:12px;background:var(--panel);padding:7px 9px;border-radius:8px;font-size:11px;opacity:.88;pointer-events:none}@media(max-width:760px){.stats{width:205px;padding:8px}.quest{top:150px;left:12px;width:205px}.actions{top:265px;left:10px;display:grid;grid-template-columns:1fr}.moves{width:185px;right:8px;bottom:82px;padding:8px}.toolbar{bottom:12px;gap:3px}.slot{min-width:64px;height:50px;padding:5px}.slot strong{font-size:10px}.help{display:none}.fruitGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<canvas id="game" aria-label="Blox Islands game"></canvas><div id="hud">
<section class="panel stats"><div class="brand">🏝️ BLOX ISLANDS</div><div class="barrow"><b>HP</b><div class="bar"><div id="hpFill" class="fill hp"></div></div></div><div class="barrow"><b>ENERGY</b><div class="bar"><div id="energyFill" class="fill en"></div></div></div><div class="barrow"><b>XP</b><div class="bar"><div id="xpFill" class="fill xp"></div></div></div><div id="statsLine">Level 1 · 500 Beli · 3 stat points</div><div class="cornerButtons"><button id="statsBtn">📊 Stats</button><button id="bagBtn">🎒 Backpack</button></div></section>
<section class="panel quest"><small id="seaLabel">FIRST SEA · QUEST</small><strong id="questName">Bandit Trouble</strong><p id="questText">Talk to a quest giver.<br><b id="questCount">0 / 5</b></p></section>
<section class="panel moves"><h3 id="moveTitle">Combat Moves</h3><div id="moveList"></div></section><div id="regionName" class="region"></div><div id="toast"></div>
<div class="toolbar"><button class="slot active" data-slot="1"><kbd>1</kbd><strong>Combat</strong></button><button class="slot" data-slot="2" disabled><kbd>2</kbd><strong>Locked</strong></button><button class="slot" data-slot="3" disabled><kbd>3</kbd><strong>Locked</strong></button><button class="slot" data-slot="4" disabled><kbd>4</kbd><strong>Locked</strong></button></div>
<div class="actions"><button class="action" id="boatBtn">⛵ Boat</button></div><div class="help">Move WASD · Attack click/Z · Skill X · Interact E · Gear 1–4 · Boat B</div>
<section class="modal" id="modal"><button class="close" id="closeModal">Close ✕</button><h2 id="modalTitle">Menu</h2><div id="modalBody"></div></section></div>
<script src="./game.js?v=3"></script></body></html>
