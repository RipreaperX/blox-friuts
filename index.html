<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102239"><title>Blox Islands — Adventure</title>
<style>
:root{color-scheme:dark;--panel:#101d2eee;--line:#ffffff2b;--gold:#ffce55;--mint:#7af0ac;--ink:#f4f8ff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#1476ad;color:var(--ink);font:14px system-ui,Arial,sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}button{font:inherit;color:inherit;cursor:pointer}.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 22px #0005;backdrop-filter:blur(8px)}.stats{left:10px;bottom:10px;width:245px}.brand{font-weight:900;font-size:16px;margin-bottom:6px}.barrow{display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center;margin:4px 0;font-size:11px;font-weight:800}.bar{height:10px;background:#ffffff20;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;transition:width .12s}.hp{background:#ff586b}.en{background:#43b7ff}.xp{background:#ffcf53}#statsLine{font-size:11px;margin:6px 0}.btnrow{display:flex;gap:5px}.btnrow button,.action{background:#ffffff12;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-weight:800}.quest{left:10px;top:10px;width:230px}.quest small{color:#aabed2}.quest strong{display:block;color:var(--mint);margin:3px 0}.quest p{font-size:11px;margin:0}.moves{right:10px;bottom:10px;width:225px}.moves h3{margin:0 0 5px;font-size:14px}.move{display:flex;justify-content:space-between;border-top:1px solid #ffffff19;padding:5px 0;font-size:11px}.move button{background:#ffce5520;border:1px solid #ffce5570;border-radius:5px;padding:2px 6px;font-weight:800}.toolbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px}.slot{min-width:76px;height:52px;background:var(--panel);border:2px solid var(--line);border-radius:9px;padding:5px;text-align:left}.slot.active{border-color:var(--gold)}.slot:disabled{opacity:.42}.slot kbd{float:right;background:#ffffff20;padding:0 4px;border-radius:4px}.slot strong{display:block;font-size:11px;margin-top:5px}.actions{position:absolute;left:10px;bottom:135px;display:grid;gap:5px}.help{position:absolute;right:10px;top:10px;background:var(--panel);padding:6px 8px;border-radius:7px;font-size:10px}.toast{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:9px 13px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:800;text-align:center}.region{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:clamp(25px,5vw,52px);font-weight:1000;text-shadow:0 4px 15px #000;opacity:0;pointer-events:none;transition:opacity .3s}.modal{display:none;position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 20px));max-height:82vh;overflow:auto;background:#101d2ef7;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 16px 70px #0009}.modal h2{margin:0 0 10px}.close{float:right;background:#ffffff18;border:0;border-radius:6px;padding:5px 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.fruitGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#ffffff0b;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}.card button,.modal button:not(.close){border-radius:6px}.card button{display:block;margin-top:6px;background:var(--gold);color:#322716;border:0;padding:5px 8px;font-weight:900}.statrow{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid var(--line)}.statrow button{background:var(--gold);color:#322716;border:0;padding:4px 9px}.touch{display:none;position:absolute;left:10px;top:42%;gap:5px}.touch button{width:45px;height:42px;background:#101d2eaa;border:1px solid var(--line);border-radius:8px}.touch .pad{display:grid;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,42px)}.touch .up{grid-column:2}.touch .left{grid-column:1;grid-row:2}.touch .down{grid-column:2;grid-row:2}.touch .right{grid-column:3;grid-row:2}.touch .fight{display:flex;flex-direction:column;gap:5px}@media(max-width:700px){.quest{width:190px}.stats{width:190px;padding:7px;bottom:7px;left:7px}.actions{bottom:122px;left:7px}.moves{width:165px;right:7px;bottom:72px;padding:7px}.toolbar{bottom:7px;gap:2px}.slot{min-width:57px;height:47px;padding:4px}.slot strong{font-size:9px}.help{display:none}.fruitGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.touch{display:flex}.brand{font-size:14px}}
</style>
</head><body>
<canvas id="game" aria-label="Blox Islands game world"></canvas><div id="hud">
<section class="panel stats"><div class="brand">🏝️ BLOX ISLANDS</div><div class="barrow"><b>HP</b><div class="bar"><div id="hpFill" class="fill hp"></div></div></div><div class="barrow"><b>ENERGY</b><div class="bar"><div id="energyFill" class="fill en"></div></div></div><div class="barrow"><b>XP</b><div class="bar"><div id="xpFill" class="fill xp"></div></div></div><div id="statsLine"></div><div class="btnrow"><button id="statsBtn">📊 Stats</button><button id="bagBtn">🎒 Backpack</button></div></section>
<section class="panel quest"><small id="seaLabel"></small><strong id="questName">Quest</strong><p id="questText"></p></section><section class="panel moves"><h3 id="moveTitle">Combat Moves</h3><div id="moveList"></div></section>
<div class="toolbar"><button class="slot active" data-slot="1"><kbd>1</kbd><strong>Combat</strong></button><button class="slot" data-slot="2" disabled><kbd>2</kbd><strong>Locked</strong></button><button class="slot" data-slot="3" disabled><kbd>3</kbd><strong>Locked</strong></button><button class="slot" data-slot="4" disabled><kbd>4</kbd><strong>Locked</strong></button></div><div class="actions"><button class="action" id="shopBtn">🛒 Shops</button><button class="action" id="mapBtn">🗺️ Seas</button><button class="action" id="hakiBtn">✨ Haki</button><button class="action" id="raidBtn">⚔️ Raid</button></div>
<div class="help">WASD move · Click/Z attack · X skill · E interact · 1–4 gear · M map</div><div id="toast" class="toast"></div><div id="regionName" class="region"></div>
<div class="touch"><div class="pad"><button class="up" data-key="w">▲</button><button class="left" data-key="a">◀</button><button class="down" data-key="s">▼</button><button class="right" data-key="d">▶</button></div><div class="fight"><button id="touchAttack">⚔</button><button id="touchSkill">✨</button><button id="touchInteract">E</button></div></div>
<section class="modal" id="modal"><button class="close" id="closeModal">Close ✕</button><h2 id="modalTitle">Menu</h2><div id="modalBody"></div></section></div><script src="./game.js?v=5"></script></body></html>
